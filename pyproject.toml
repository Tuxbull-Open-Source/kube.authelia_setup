[tool.ruff]
target-version = "py310"
line-length = 100
exclude = [".private", ".venv", "current_config"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/lab/*.py" = ["E402"]  # QA sets restrictive umask before loading fixtures.

[tool.ruff.format]
quote-style = "double"
