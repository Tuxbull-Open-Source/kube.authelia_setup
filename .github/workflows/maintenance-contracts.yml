name: Authelia maintenance contracts

"on":
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
        umask: ['022', '077']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python }}
      - name: Install pinned test-only dependencies
        run: python -m pip install PyYAML==6.0.3 ruff==0.17.6
      - name: Local contracts only; no cluster or production credentials
        run: |
          umask ${{ matrix.umask }}
          bash -n configure.sh install.sh maintain.sh doctor.sh provision-host.sh
          python -m unittest discover -s tests -v
          python -m compileall -q scripts tests
          ruff check scripts tests
          ruff format --check scripts tests
          git diff --check
